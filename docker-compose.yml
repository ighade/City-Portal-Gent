services:
  postgres:
    image: postgres:16-alpine
    container_name: parkinggent-postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5434:5432"
    volumes:
      - parkinggent-postgres:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: ./ParkingGent.Api/Dockerfile
    container_name: parkinggent-backend
    depends_on:
      - postgres
    env_file:
      - .env
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:5000
      ConnectionStrings__DefaultConnection: ${ConnectionStrings__DefaultConnection}
      TZ: Europe/Brussels
    ports:
      - "5101:5000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: ./Dockerfile
    container_name: parkinggent-frontend
    depends_on:
      - backend
    ports:
      - "8080:80"
    restart: unless-stopped

volumes:
  parkinggent-postgres:
