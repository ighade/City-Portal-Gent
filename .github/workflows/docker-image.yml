name: Docker Image CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  build:

    runs-on: self-hosted

    steps:
    - uses: actions/checkout@v4

    - name: Create .env from example
      run: |
        if [ ! -f .env ]; then
          cp .env.example .env
        fi

    - name: Validate compose file
      run: docker compose config --quiet
    
    - name: Build the Docker image
      run: docker compose build
